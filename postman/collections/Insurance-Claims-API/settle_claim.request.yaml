$kind: http-request
name: settle_claim
method: POST
url: 'http://localhost:8080/api/v1/claims/:id/settlement'
pathVariables:
  - key: id
    value: '1'
    description: The unique ID of the claim to settle
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "reason": "Claim verified and approved. Settlement amount of $12,500 will be processed within 5 business days."
    }
