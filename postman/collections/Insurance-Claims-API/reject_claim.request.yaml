$kind: http-request
name: reject_claim
method: POST
url: 'http://localhost:8080/api/v1/claims/:id/rejection'
pathVariables:
  - key: id
    value: '1'
    description: The unique ID of the claim to reject
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "reason": "Claim rejected due to insufficient evidence and policy exclusions applicable to the reported incident."
    }
