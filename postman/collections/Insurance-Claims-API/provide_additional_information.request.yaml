$kind: http-request
name: provide_additional_information
method: POST
url: 'http://localhost:8080/api/v1/claims/:id/additional-information'
pathVariables:
  - key: id
    value: '1'
    description: The unique ID of the claim to provide additional information for
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "information": "Attached are the requested documents including the repair invoice and photos of the damage."
    }
