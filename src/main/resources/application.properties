# Application Name
spring.application.name=insurance-claims-management

# MySQL database connection details; credentials are loaded from Secrets Manager
spring.datasource.url=jdbc:mysql://localhost:3306/insurance_claims_db
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# LocalStack Secrets Manager configuration
app.database.credentials.enabled=true
app.database.credentials.secret-name=${DB_CREDENTIALS_SECRET_NAME:insurance-claims/database}
app.database.credentials.endpoint=${AWS_ENDPOINT_URL:http://localhost:4566}
app.database.credentials.region=${AWS_REGION:ap-south-1}
app.database.credentials.access-key=${AWS_ACCESS_KEY_ID:test}
app.database.credentials.secret-key=${AWS_SECRET_ACCESS_KEY:test}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
