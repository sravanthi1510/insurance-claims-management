services:
  localstack:
    build:
      context: docker/localstack
    ports:
      - "4566:4566"
    environment:
      SERVICES: secretsmanager
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      DB_CREDENTIALS_SECRET_NAME: ${DB_CREDENTIALS_SECRET_NAME:-insurance-claims/database}
      DB_USERNAME: ${DB_USERNAME:-claims_app}
      DB_PASSWORD: ${DB_PASSWORD:-local-dev-password}
    healthcheck:
      test: ["CMD", "bash", "-c", "awslocal secretsmanager describe-secret --secret-id \"$${DB_CREDENTIALS_SECRET_NAME}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  mysql:
    image: mysql:8.4
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: insurance_claims_db
      MYSQL_USER: ${DB_USERNAME:-claims_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-local-dev-password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-password}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "--password=$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
